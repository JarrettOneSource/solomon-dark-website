# Inert evidence draft. Publish only after owner review to:
# .github/workflows/intel-startup-diagnostic.yml on codex/diagnose-intel-c20-sh9aksle.
# Do not edit Validate. The coordinator must cancel ONLY the redundant Validate
# run matching this diagnostic branch AND this new commit SHA, never run 38627598058.
name: Intel startup diagnostic (not release acceptance)

on:
  push:
    branches:
      - codex/diagnose-intel-c20-sh9aksle

permissions:
  contents: read
  actions: read

jobs:
  observe-intel-startup:
    name: Observe Intel startup (diagnostic only)
    if: github.repository == 'JarrettOneSource/solomon-dark-website' && github.ref == 'refs/heads/codex/diagnose-intel-c20-sh9aksle'
    runs-on: macos-15-intel
    timeout-minutes: 35
    env:
      EXPECTED_REVISION: c20fd89cb98c3a76f0852305252f1a3ba06fd59a
      EXPECTED_ARTIFACT_ID: '11923264947'
      EXPECTED_ARTIFACT_DIGEST: 0d704d27e2622574aad2469c0fbe92aafd54cbdfc5f5b2e5f829a00ce9338671
    steps:
      - name: Check out only diagnostic tools
        uses: actions/checkout@v6
        with:
          path: diagnostic-tools
          persist-credentials: false
          sparse-checkout: tools/diagnostics
          sparse-checkout-cone-mode: true
      - name: Check out immutable product source
        uses: actions/checkout@v6
        with:
          ref: c20fd89cb98c3a76f0852305252f1a3ba06fd59a
          path: product
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.17.0'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare evidence and verify source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/intel-diagnostic-evidence" "$RUNNER_TEMP/intel-package"
          test "$(git -C product rev-parse HEAD)" = "$EXPECTED_REVISION"
          test -z "$(git -C product status --porcelain)"
          {
            date -u
            sw_vers
            uname -m
            sysctl -n hw.logicalcpu hw.memsize
            node --version
            printf 'ImageOS=%s\nImageVersion=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          } > "$RUNNER_TEMP/intel-diagnostic-evidence/runner.txt"
      - name: Download and verify exact retained Intel package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/intel-diagnostic-evidence"
          gh api "repos/JarrettOneSource/solomon-dark-website/actions/artifacts/$EXPECTED_ARTIFACT_ID" > "$evidence/artifact-api.json"
          gh api "repos/JarrettOneSource/solomon-dark-website/actions/artifacts/$EXPECTED_ARTIFACT_ID/zip" > "$RUNNER_TEMP/intel-artifact.zip"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, zipfile
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          evidence = root / "intel-diagnostic-evidence"
          meta = json.loads((evidence / "artifact-api.json").read_text())
          expected = os.environ["EXPECTED_ARTIFACT_DIGEST"]
          assert meta["id"] == int(os.environ["EXPECTED_ARTIFACT_ID"])
          assert meta["name"] == "desktop-darwin-x64" and not meta["expired"]
          assert meta["workflow_run"]["id"] == 38606111614
          assert meta["workflow_run"]["head_sha"] == os.environ["EXPECTED_REVISION"]
          assert meta["digest"] == "sha256:" + expected
          archive = root / "intel-artifact.zip"
          digest = hashlib.file_digest(archive.open("rb"), "sha256").hexdigest()
          assert digest == expected, (digest, expected)
          extracted = root / "intel-artifact"
          extracted.mkdir()
          with zipfile.ZipFile(archive) as bundle:
              for item in bundle.infolist():
                  path = pathlib.PurePosixPath(item.filename)
                  assert not path.is_absolute() and ".." not in path.parts
                  assert not item.is_dir() or item.file_size == 0
              bundle.extractall(extracted)
          zips = list(extracted.rglob("Solomon-Darker-darwin-x64.zip"))
          assert len(zips) == 1
          inner = zips[0]
          checksum = pathlib.Path(str(inner) + ".sha256").read_text().strip()
          match = re.fullmatch(r"([0-9a-f]{64})\s+Solomon-Darker-darwin-x64.zip", checksum)
          assert match
          inner_digest = hashlib.file_digest(inner.open("rb"), "sha256").hexdigest()
          assert inner_digest == match[1]
          with zipfile.ZipFile(inner) as bundle:
              for item in bundle.infolist():
                  path = pathlib.PurePosixPath(item.filename)
                  assert not path.is_absolute() and ".." not in path.parts
          subprocess.run(["/usr/bin/ditto", "-x", "-k", str(inner), str(root / "intel-package")], check=True)
          app = root / "intel-package" / "Solomon Darker-darwin-x64"
          manifest = json.loads((app / "desktop-package-manifest.json").read_text())
          assert manifest["revision"] == os.environ["EXPECTED_REVISION"]
          assert manifest["platform"] == "darwin" and manifest["arch"] == "x64"
          assert manifest["electronVersion"] == "43.4.0"
          assert manifest["nodeRuntime"]["version"] == "22.17.0"
          assert manifest["executable"] == "Solomon Darker.app/Contents/MacOS/solomon-darker"
          assert (app / manifest["executable"]).is_file()
          (evidence / "verified-package.json").write_text(json.dumps({
              "acceptance": False, "artifactId": meta["id"], "artifactDigest": digest,
              "innerArchiveDigest": inner_digest, "manifest": manifest,
          }, indent=2) + "\n")
          PY
      - name: Install pinned observer dependencies only
        working-directory: product/frontend
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.2
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Check diagnostic scripts without launching
        shell: bash
        env:
          SDR_SOURCE_ROOT: ${{ github.workspace }}/product
          SDR_DESKTOP_EVIDENCE: ${{ runner.temp }}/intel-diagnostic-evidence
        run: |
          set -euo pipefail
          tools="$GITHUB_WORKSPACE/diagnostic-tools/tools/diagnostics"
          node --check "$tools/desktop-timeout-observer.mjs"
          node --check "$tools/intel-startup-diagnostic.mjs"
          node --test "$tools/intel-startup-diagnostic.test.mjs"
          node "$tools/intel-startup-diagnostic.mjs" --prepare-only
          node --check "$RUNNER_TEMP/intel-diagnostic-evidence/instrumented-smoke.mjs"
          python3 "$tools/package-inventory.py" "$RUNNER_TEMP/intel-package/Solomon Darker-darwin-x64" "$RUNNER_TEMP/intel-diagnostic-evidence/package-files-before.json"
      - name: Observe unchanged packaged acceptance workload
        shell: bash
        env:
          SDR_SOURCE_ROOT: ${{ github.workspace }}/product
          SDR_DESKTOP_APP: ${{ runner.temp }}/intel-package/Solomon Darker-darwin-x64
          SDR_DESKTOP_EVIDENCE: ${{ runner.temp }}/intel-diagnostic-evidence
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/diagnostic-tools/tools/diagnostics/intel-startup-diagnostic.mjs" --run 2>&1 | tee "$SDR_DESKTOP_EVIDENCE/run.log"
      - name: Verify packaged bytes and product checkout remained unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/intel-diagnostic-evidence"
          if [[ -f "$evidence/package-files-before.json" ]]; then
            python3 "$GITHUB_WORKSPACE/diagnostic-tools/tools/diagnostics/package-inventory.py" "$RUNNER_TEMP/intel-package/Solomon Darker-darwin-x64" "$evidence/package-files-after.json"
            cmp "$evidence/package-files-before.json" "$evidence/package-files-after.json"
          fi
          test "$(git -C product rev-parse HEAD)" = "$EXPECTED_REVISION"
          test -z "$(git -C product status --porcelain)"
      - name: Retain diagnostic evidence separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intel-startup-diagnostic-not-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/intel-diagnostic-evidence
          if-no-files-found: error
          retention-days: 14
