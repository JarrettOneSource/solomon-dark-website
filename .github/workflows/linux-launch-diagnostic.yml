# Diagnostic only. Publication is owned by the coordinator; do not edit Validate.
name: Linux passive capture diagnostic (retained failing 39875413, not acceptance)

on:
  push:
    branches:
      - codex/diagnose-intel-c20-sh9aksle
    paths:
      - .github/workflows/linux-launch-diagnostic.yml
      - tools/diagnostics/linux-launch-diagnostic.mjs
      - tools/diagnostics/linux-launch-diagnostic.test.mjs
      - tools/diagnostics/linux-launch-observer.mjs
      - tools/diagnostics/linux-cpu-calibration.py
      - tools/diagnostics/linux-cpu-calibration.test.py

permissions:
  contents: read
  actions: read

jobs:
  observe-linux-launch:
    name: Passively observe retained failing 39875413 Linux peer captures
    if: github.repository == 'JarrettOneSource/solomon-dark-website' && github.ref == 'refs/heads/codex/diagnose-intel-c20-sh9aksle' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_REVISION: 39875413fa2d3313d5d42170993c7dfa3e885cd1
      EXPECTED_PRODUCT_TREE: 4d921486310f73246c3adf92c0e84b9077112a68
      EXPECTED_ORCHESTRATION: 0d8ae95e7af35d62464b5d80d6d2698bac43bae4
      EXPECTED_RUN_ID: '38787359411'
      EXPECTED_JOB_ID: '116602702052'
      EXPECTED_INNER_DIGEST: 79edf19e60a82ff0ec5f4a512f9797e36ab6bc9269f5b9c87020e37a0dcc5a27
      EXPECTED_MANIFEST_DIGEST: 4aab907f1c26c352c0f733120e954c7dd480e369533b68169cb966fff4dd3864
      EXPECTED_ARTIFACT_ID: '11997259442'
      EXPECTED_ARTIFACT_DIGEST: 70ca300f9cbf665c3700899a5b716153249d60c5dff496db40e625fd592defa7
      SDR_SOURCE_ROOT: ${{ github.workspace }}/product
    steps:
      - name: Check out only diagnostic tools
        uses: actions/checkout@v6
        with:
          path: diagnostic-tools
          persist-credentials: false
          sparse-checkout: |
            tools/diagnostics
            .github/workflows/linux-launch-diagnostic.yml
          sparse-checkout-cone-mode: false
      - name: Check out immutable product source
        uses: actions/checkout@v6
        with:
          ref: 39875413fa2d3313d5d42170993c7dfa3e885cd1
          path: product
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.17.0'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare separate evidence and verify source
        shell: bash
        env:
          SDR_DESKTOP_APP: ${{ runner.temp }}/linux-package/Solomon Darker-linux-x64
          SDR_DESKTOP_EVIDENCE: ${{ runner.temp }}/linux-launch-evidence
          SDR_DIAGNOSTIC_RUNTIME: ${{ runner.temp }}/linux-launch-runtime
        run: |
          set -euo pipefail
          printf '%s\n' "SDR_DESKTOP_APP=$SDR_DESKTOP_APP" "SDR_DESKTOP_EVIDENCE=$SDR_DESKTOP_EVIDENCE" "SDR_DIAGNOSTIC_RUNTIME=$SDR_DIAGNOSTIC_RUNTIME" >> "$GITHUB_ENV"
          mkdir -p "$SDR_DESKTOP_EVIDENCE" "$SDR_DIAGNOSTIC_RUNTIME" "$RUNNER_TEMP/linux-package"
          test "$(git -C product rev-parse HEAD)" = "$EXPECTED_REVISION"
          test "$(git -C product rev-parse HEAD^{tree})" = "$EXPECTED_PRODUCT_TREE"
          test -z "$(git -C product status --porcelain)"
          {
            date -u
            uname -srm
            node --version
            printenv ImageOS ImageVersion
          } > "$SDR_DESKTOP_EVIDENCE/runner.txt"
      - name: Download and verify exact retained failing Linux package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/JarrettOneSource/solomon-dark-website/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --jq '[.jobs[] | select(.name == "Passively observe retained failing 39875413 Linux peer captures") | {id, run_id, run_attempt, runner_id, runner_group_id, status, conclusion}]' > "$SDR_DESKTOP_EVIDENCE/runner-identity.json"
          gh api "repos/JarrettOneSource/solomon-dark-website/actions/artifacts/$EXPECTED_ARTIFACT_ID" > "$SDR_DESKTOP_EVIDENCE/artifact-api.json"
          gh api "repos/JarrettOneSource/solomon-dark-website/actions/jobs/$EXPECTED_JOB_ID" > "$SDR_DESKTOP_EVIDENCE/retained-package-failing-job.json"
          gh api "repos/JarrettOneSource/solomon-dark-website/actions/artifacts/$EXPECTED_ARTIFACT_ID/zip" > "$RUNNER_TEMP/linux-artifact.zip"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, posixpath, re, stat, subprocess, zipfile
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          evidence = pathlib.Path(os.environ["SDR_DESKTOP_EVIDENCE"])
          runners = json.loads((evidence / "runner-identity.json").read_text())
          assert len(runners) == 1
          runner = runners[0]
          assert all(type(runner[key]) is int and runner[key] > 0 for key in ("id", "run_id", "run_attempt", "runner_id"))
          assert type(runner["runner_group_id"]) is int and runner["runner_group_id"] >= 0
          assert runner["run_id"] == int(os.environ["GITHUB_RUN_ID"]) and runner["run_attempt"] == 1
          assert runner["status"] == "in_progress" and runner["conclusion"] is None
          meta = json.loads((evidence / "artifact-api.json").read_text())
          failed = json.loads((evidence / "retained-package-failing-job.json").read_text())
          expected = os.environ["EXPECTED_ARTIFACT_DIGEST"]
          revision = os.environ["EXPECTED_REVISION"]
          run_id = int(os.environ["EXPECTED_RUN_ID"])
          orchestration = os.environ["EXPECTED_ORCHESTRATION"]
          assert failed["id"] == int(os.environ["EXPECTED_JOB_ID"]) and failed["run_id"] == run_id
          assert failed["head_sha"] == orchestration and failed["conclusion"] == "failure"
          assert failed["run_attempt"] == 1
          assert failed["name"] == "Original Linux acceptance on newly built 39875413"
          steps = {step["name"]: step["conclusion"] for step in failed["steps"]}
          assert steps["Verify packaged offline save and peer gameplay"] == "failure"
          for step in ["Verify clean pinned source and qualification contract", "Run original desktop tests",
                       "Build standalone app from exact source with original generator", "Archive newly built app with original archiver",
                       "Bind retained archive to package and dependency inventories", "Retain newly built package before acceptance can fail"]:
              assert steps[step] == "success"
          assert meta["id"] == int(os.environ["EXPECTED_ARTIFACT_ID"])
          assert meta["name"] == "linux-new-package-39875413-" + str(run_id) and not meta["expired"]
          assert meta["workflow_run"]["id"] == run_id
          assert meta["workflow_run"]["head_sha"] == orchestration
          assert meta["digest"] == "sha256:" + expected
          archive = root / "linux-artifact.zip"
          digest = hashlib.file_digest(archive.open("rb"), "sha256").hexdigest()
          assert digest == expected
          extracted = root / "linux-artifact"
          extracted.mkdir()
          with zipfile.ZipFile(archive) as bundle:
              for item in bundle.infolist():
                  path = pathlib.PurePosixPath(item.filename)
                  assert not path.is_absolute() and ".." not in path.parts
                  assert not stat.S_ISLNK(item.external_attr >> 16)
              bundle.extractall(extracted)
          zips = list(extracted.rglob("Solomon-Darker-linux-x64.zip"))
          assert len(zips) == 1
          inner = zips[0]
          checksum = pathlib.Path(str(inner) + ".sha256").read_text().strip()
          match = re.fullmatch(r"([0-9a-f]{64})\s+Solomon-Darker-linux-x64.zip", checksum)
          assert match
          inner_digest = hashlib.file_digest(inner.open("rb"), "sha256").hexdigest()
          assert inner_digest == match[1] == os.environ["EXPECTED_INNER_DIGEST"]
          assert inner.stat().st_size == 330254721
          with zipfile.ZipFile(inner) as bundle:
              for item in bundle.infolist():
                  path = pathlib.PurePosixPath(item.filename)
                  assert not path.is_absolute() and ".." not in path.parts
                  assert path.parts[0] == "Solomon Darker-linux-x64"
                  if stat.S_ISLNK(item.external_attr >> 16):
                      target = bundle.read(item).decode("utf-8")
                      assert not target.startswith("/")
                      resolved = posixpath.normpath(str(path.parent / target))
                      assert resolved.startswith("Solomon Darker-linux-x64/")
          subprocess.run(["unzip", "-q", str(inner), "-d", str(root / "linux-package")], check=True)
          app = pathlib.Path(os.environ["SDR_DESKTOP_APP"])
          manifest_path = app / "desktop-package-manifest.json"
          manifest_digest = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          assert manifest_digest == os.environ["EXPECTED_MANIFEST_DIGEST"]
          manifest = json.loads(manifest_path.read_text())
          assert manifest["revision"] == revision
          assert manifest["schemaVersion"] == 1 and manifest["sourceTimestamp"] == 1792080494
          assert manifest["platform"] == "linux" and manifest["arch"] == "x64"
          assert manifest["electronVersion"] == "43.4.0"
          assert manifest["nodeRuntime"]["version"] == "22.17.0"
          assert manifest["nodeRuntime"]["sha256"] == "325c0f1261e0c61bcae369a1274028e9cfb7ab7949c05512c5b1e630f7e80e12"
          assert manifest["executable"] == "solomon-darker"
          assert (app / manifest["executable"]).is_file()
          assert os.access(app / manifest["executable"], os.X_OK)
          (evidence / "verified-package.json").write_text(json.dumps({
              "acceptance": False, "diagnostic": True, "artifactId": meta["id"],
              "qualificationRunId": run_id, "qualificationJobId": failed["id"], "qualificationConclusion": "failure",
              "qualificationOrchestration": orchestration, "artifactDigest": digest,
              "productRevision": revision, "productTree": os.environ["EXPECTED_PRODUCT_TREE"],
              "innerArchiveDigest": inner_digest, "innerArchiveBytes": inner.stat().st_size,
              "manifestDigest": manifest_digest, "manifest": manifest,
              "originalFailedRunId": 38766573551,
              "scope": "Retained newly built exact-source package from failed run 38787359411; not original unretained run 38766573551 bytes. Diagnostic only, not acceptance.",
          }, indent=2) + "\n")
          PY
      - name: Install pinned observer dependencies without product builds
        working-directory: product/frontend
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.2
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Check metadata observer and full original workload without launching
        shell: bash
        run: |
          set -euo pipefail
          tools="$GITHUB_WORKSPACE/diagnostic-tools/tools/diagnostics"
          node --check "$tools/linux-launch-observer.mjs"
          node --check "$tools/linux-launch-diagnostic.mjs"
          node --test "$tools/linux-launch-diagnostic.test.mjs"
          PYTHONDONTWRITEBYTECODE=1 python3 "$tools/linux-cpu-calibration.test.py"
          python3 "$tools/package-inventory.py" "$SDR_DESKTOP_APP" "$SDR_DESKTOP_EVIDENCE/package-files-before.json"
          python3 "$tools/package-inventory.py" "$SDR_SOURCE_ROOT/frontend/node_modules/playwright-core" "$SDR_DESKTOP_EVIDENCE/playwright-files-before.json"
      - name: Observe full original workload and both peer captures
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a node "$GITHUB_WORKSPACE/diagnostic-tools/tools/diagnostics/linux-launch-diagnostic.mjs" --run
      - name: Verify immutable package and dependency bytes after observation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tools="$GITHUB_WORKSPACE/diagnostic-tools/tools/diagnostics"
          if [[ -f "$SDR_DESKTOP_EVIDENCE/package-files-before.json" ]]; then
            python3 "$tools/package-inventory.py" "$SDR_DESKTOP_APP" "$SDR_DESKTOP_EVIDENCE/package-files-after.json"
            cmp "$SDR_DESKTOP_EVIDENCE/package-files-before.json" "$SDR_DESKTOP_EVIDENCE/package-files-after.json"
          fi
          if [[ -f "$SDR_DESKTOP_EVIDENCE/playwright-files-before.json" ]]; then
            python3 "$tools/package-inventory.py" "$SDR_SOURCE_ROOT/frontend/node_modules/playwright-core" "$SDR_DESKTOP_EVIDENCE/playwright-files-after.json"
            cmp "$SDR_DESKTOP_EVIDENCE/playwright-files-before.json" "$SDR_DESKTOP_EVIDENCE/playwright-files-after.json"
          fi
          test "$(git -C product rev-parse HEAD)" = "$EXPECTED_REVISION"
          test "$(git -C product rev-parse HEAD^{tree})" = "$EXPECTED_PRODUCT_TREE"
          test -z "$(git -C product status --porcelain)"
      - name: Retain metadata-only diagnostic evidence separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-launch-diagnostic-not-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/linux-launch-evidence
          if-no-files-found: error
          retention-days: 14
