<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Solomon Dark Native UI Workbench</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #08090c; color: #ddd3b7; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top, #202334, #08090c 60%); }
      header { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; padding: 14px 18px; border-bottom: 1px solid #65552e; background: rgb(5 6 9 / 0.88); }
      h1 { margin: 0 auto 0 0; color: #e0c574; font: 600 18px Georgia, serif; letter-spacing: 0.08em; }
      label { display: grid; gap: 4px; color: #9b927c; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
      select, input, button { min-height: 34px; border: 1px solid #79683b; color: #eadcae; background: #11131a; }
      select, input { padding: 5px 8px; }
      button { padding: 5px 14px; cursor: pointer; }
      button[aria-pressed="true"] { border-color: #e0c574; background: #2d2819; }
      main { display: grid; place-items: center; padding: 18px; }
      #native-ui-stage { width: min(100%, 1600px); aspect-ratio: 16 / 9; overflow: hidden; border: 1px solid #65552e; box-shadow: 0 20px 70px #000; background: #000; }
      #native-ui-stage canvas { display: block; width: 100%; height: 100%; }
      #native-ui-stage { position: relative; }
      .native-ui-dom-workbench { position: absolute; width: 1600px; height: 900px; transform-origin: top left; }
      #native-ui-status { width: min(100%, 1600px); margin: 10px auto 0; color: #8d8779; font: 12px ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <header>
      <h1>Native UI Workbench</h1>
      <button id="show-components" type="button" aria-pressed="true">Building blocks</button>
      <button id="show-dom" type="button" aria-pressed="false">DOM components</button>
      <button id="show-atlas" type="button" aria-pressed="false">Atlas record</button>
      <label>Atlas <select id="atlas"></select></label>
      <label>Record <input id="record" type="number" min="0" step="1" value="0" /></label>
      <button id="previous" type="button" aria-label="Previous record">Previous</button>
      <button id="next" type="button" aria-label="Next record">Next</button>
    </header>
    <main>
      <div id="native-ui-stage" aria-label="Stock UI visual preview"></div>
      <output id="native-ui-status" aria-live="polite">Loading stock atlases…</output>
    </main>
    <script type="module" src="/src/game/native-ui/native-ui-workbench.ts"></script>
  </body>
</html>
